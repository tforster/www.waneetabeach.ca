<body class="bg-background min-h-screen font-body-md text-on-background relative overflow-hidden flex items-center justify-center p-margin-mobile md:p-margin-desktop">

<div class="absolute inset-0 z-0">
<img alt="" class="w-full h-full object-cover opacity-60" data-alt="A serene, light-filled photograph of the Lake Erie shoreline on a late summer afternoon. The water is calm, meeting a bright, expansive horizon. The scene embodies a modern minimalist and coastal aesthetic, featuring soft, airy lighting and a palette of pale blues, crystal skies, and gentle sandy tones. The mood is tranquil, spacious, and inviting, perfectly suited as a subtle, high-key background for a premium digital interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUNDIQrVh6qfpCH3YQe7naOMihK_XnY2_sRiru9Y4ZMGvFqrQTPYMyklFV7vWRR3LvQfkBW6zvhFW9s3bdEnm4Y19UY1N6Uv_34NskcNMXP5KwmFxc0J7Os90x8aNRCChNuf08H36xX0ixXFbJFmqANvMoYsKy2e_gAAm1hWlIjZbJ1YE6eb_xGs9Hx3djrWjheahct-vhED1fzYwHE1-1ZGrcoP72BQAxAyJZzS2oQpKeQiOUYsRr08DRY-lT2xzH-mmBs2FkD7E"/>
<!-- Glassmorphism overlay to ensure contrast and airiness -->
<div class="absolute inset-0 bg-surface-bright/70 backdrop-blur-sm"></div>
</div>
<!-- Login Card Container -->
<main class="relative z-10 w-full max-w-[440px]">
<!-- Glassmorphic Card -->
<div class="bg-surface-container-lowest/95 backdrop-blur-md rounded-[24px] p-8 md:p-10 shadow-[0_8px_32px_rgba(42,91,125,0.08)] border border-surface-container-highest/50">
<!-- Header Section -->
<div class="text-center mb-8">
<div class="w-16 h-16 mx-auto bg-primary-container/20 rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="waves" style="font-variation-settings: 'FILL' 1;">waves</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight mb-2">Waneeta Beach</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back to the shoreline.</p>
</div>
<!-- Form Section -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-12 pr-4 h-touch-target-min rounded-xl border border-outline-variant bg-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 font-body-md text-body-md text-on-surface placeholder-outline transition-all" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="block font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-12 pr-4 h-touch-target-min rounded-xl border border-outline-variant bg-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 font-body-md text-body-md text-on-surface placeholder-outline transition-all" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-touch-target-min flex items-center justify-center gap-2 bg-primary text-on-primary rounded-full font-label-sm text-label-sm hover:opacity-90 transition-opacity shadow-[0_4px_14px_rgba(8,67,100,0.2)] mt-8" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-[16px] text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors ml-1" href="#">Request Access</a>
</p>
</div>
</div>
